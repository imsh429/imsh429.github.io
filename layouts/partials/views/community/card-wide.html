{{/* community/card-wide : super-minimal, renders exactly ONE item */}}
{{ $item := .item }}
{{ if not $item }}
  {{/* no-op: collection 블록이 없을 땐 아무것도 렌더하지 않음 */}}
{{ else }}
<article class="rounded-xl overflow-hidden shadow p-5">
  <h3 class="text-lg font-semibold leading-snug">
    <a href="{{ $item.RelPermalink }}">{{ $item.Title | markdownify }}</a>
  </h3>
  {{ with $item.Summary }}
    <p class="mt-2 text-gray-600">{{ . | plainify }}</p>
  {{ end }}
</article>
{{ end }}
