<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  // 페이지에 여러 슬라이더가 있어도 개별 초기화
  document.querySelectorAll('.hb-swiper').forEach(function (el) {
    const autoplay = parseInt(el.dataset.autoplay || '3000', 10);
    const speed    = parseInt(el.dataset.speed    || '500', 10);
    new Swiper(el, {
      loop: true,
      autoplay: { delay: autoplay, disableOnInteraction: false, pauseOnMouseEnter: true },
      pagination: { el: el.querySelector('.swiper-pagination'), clickable: true },
      navigation: { nextEl: el.querySelector('.swiper-button-next'), prevEl: el.querySelector('.swiper-button-prev') },
      speed: speed
    });
  });
</script>
